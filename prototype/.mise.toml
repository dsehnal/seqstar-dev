[tools]
node = "26.7.0"
pnpm = "11.22.0"

[tasks.install]
description = "Install workspace dependencies from the frozen lockfile"
run = "pnpm install --frozen-lockfile"

[tasks."install:browser"]
description = "Install the Chromium browser pinned by @playwright/test"
run = "pnpm run install:browser"

[tasks.dev]
description = "Start the prototype web application"
run = "pnpm run dev"

[tasks.check]
description = "Run formatting, linting, and TypeScript project checks"
run = "pnpm run check"

[tasks.test]
description = "Run unit and contract tests"
run = "pnpm run test"

[tasks.build]
description = "Build library declarations and the prototype web application"
run = "pnpm run build"

[tasks."test:e2e"]
description = "Run browser integration tests"
run = "pnpm run test:e2e"

[tasks."check:fixtures"]
description = "Verify the offline P01 fixture manifest, hashes, mappings, and labels"
run = "pnpm run check:fixtures"

[tasks."check:dependencies"]
description = "Verify the P01 local Nightingale and single-Mol* dependency graph"
run = "pnpm run check:dependencies"

[tasks."test:e2e:p01"]
description = "Run the offline P01 Nightingale and Mol* browser feasibility proof"
run = "pnpm run test:e2e:p01"
